# ───────────────────────────────  Game  ─────────────────────────────
# Default mode + card size when /bingo start is run with no arguments.
default-mode: standard   # standard | blackout | lockout | count
default-size: 5          # 3, 4 or 5

# `count` mode: how many cells a team needs. Default = just over half the card.
count-target: 13

# Seconds before the game actually begins after /bingo start.
start-countdown: 10

# Optional hard time limit in seconds (0 = none). On expiry, most cells wins.
time-limit: 0

# Auto-assign every online player (not bingo.exempt, in survival/adventure) to a
# team, round-robin, when the game starts.
auto-assign: true

# What to do to each player when the game begins.
on-start:
  clear-inventory: true
  heal: true
  spread: true
  set-time-day: true

# Random spread distance (blocks) from the world spawn when spread is on.
spread-radius: 500

# Hardcore: a death puts that player in spectator for the rest of the game.
# Their team keeps whatever cells it has claimed.
hardcore: false

# ───────────────────────────────  Teams  ────────────────────────────
# Colour must be a MiniMessage colour: red, blue, green, yellow, aqua,
# light_purple, gold, white (also dark_* variants).
teams:
  red:
    display: Red
    color: red
  blue:
    display: Blue
    color: blue
  green:
    display: Green
    color: green
  yellow:
    display: Yellow
    color: yellow

# ─────────────────────────────  Item pool  ──────────────────────────
# `distribution` = relative weight of each tier when filling a card.
# `groups`       = named "any of these" sets; reference one in a tier as "#name"
#                  (quote it in YAML — a bare # is a comment).
# Every other key is a tier: a list of material names and/or "#group" refs.
